name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t minicommerce-backend:${{ github.sha }} .
      
      - name: Scan Docker with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: minicommerce-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library